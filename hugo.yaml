baseURL: "https://vincent-blog.top/"
theme: PaperMod
title: 文森的科技小站
copyright: "© [文森的科技小站](https://github.com/vincent-sha) 2025"

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 5

languages:
  zh:
    languageName: "中文"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:  
        - name: 分类
          url: categories/
          weight: 10
        - name: 专题
          url: series/
          weight: 20
        - name: 标签
          url: tags/
          weight: 30
        - name: 归档
          url: archives
          weight: 40
        - name: 搜索
          url: search/
          weight: 50
        - name: WiKi
          url: https://github.com/adityatelange/hugo-PaperMod/wiki/

  
outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Theme PaperMod - https://github.com/adityatelange/hugo-PaperMod"
  author: 文森
  # author: ["Me", "You"] # multiple authors

  defaultTheme: auto
  disableThemeToggle: false
  disableThemeToggleMobile: false
  disableThemeToggleDesktop: false
  ShowShareButtons: true
  ShowReadingTime: true
  disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  comments: true
  images: ["images/papermod-cover.png"]

  profileMode:
    enabled: false
    title: "文森的科技小站"
    subtitle: "专注于分享技术干货与编程知识"
    description: "欢迎来到文森的科技小站，这里有最新的技术文章和编程教程，助你提升技能，探索科技的无限可能！"
    imageUrl: "images/tech-blog.svg"
    imageTitle: my image
    # imageWidth: 120
    # imageHeight: 120
    buttons:
      - name: Archives
        url: archives
      - name: Tags
        url: tags

  homeInfoParams:
    Title: "Welcome to Vincent's Tech-Blog!"
    Content: >
      ![欢迎图片](images/undraw_building-a-website_1wrp.svg)

  socialIcons:
    - name: github
      title: View Source on Github
      url: "https://github.com/vincent-sha"
    - name: Discord
      title: Join discord community
      url: "https://discord.gg/ahpmTvhVmp"
    - name: X
      title: Share PaperMod on X/Twitter
      url: "https://x.com/intent/tweet/?text=Checkout%20Hugo%20PaperMod%20%E2%9C%A8%0AA%20fast,%20clean,%20responsive%20Hugo%20theme.&url=https://github.com/adityatelange/hugo-PaperMod&hashtags=Hugo,PaperMod"
    - name: KoFi
      title: Buy me a Ko-Fi :)
      url: "https://ko-fi.com/adityatelange"

  # editPost:
  #  URL: "https://github.com/vincent-sha/sha-hugo-papermod/tree/main/content"
  #  Text: "Suggest Changes" # edit text
  #  appendFilePath: true # to append file path to Edit link

  #label:
    # embed your /favicon.png inside an inline SVG so the theme's iconSVG branch will render it
  #  iconSVG: '<svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 35 35" aria-hidden="true"><image href="/favicon.png" width="35" height="35" preserveAspectRatio="xMidYMid slice"/></svg>'
  #  text: "文森的科技小站"
  #  icon: "favicon.png"
  #  iconHeight: 35

  # analytics:
  #     google:
  #         SiteVerificationTag: "XYZabc"

  assets:
    disableHLJS: false
    favicon: "favicon.png"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
    android_chrome_192x192: "android-chrome-192x192.png"
    android_chrome_512x512: "android-chrome-512x512.png"


  cover:
       hidden: false # hide everywhere but not in structured data
       hiddenInList: false # hide on list pages and home
       hiddenInSingle: false # hide on single page

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

# privacy:
